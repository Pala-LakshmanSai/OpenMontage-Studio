identity:
  name: "The Last Day"
  category: custom
  mood: "curious, ominous, grounded, awe-filled and reflective"
  pace: moderate
  best_for: "Original narrated science, disaster, counterfactual and deep-time films"
visual_language:
  color_palette:
    primary: ["#233541", "#687A80"]
    accent: ["#C58C51"]
    background: "#101820"
    text: "#F2F1EA"
  composition: "Full-frame moving footage and readable simulations; geographic scale, material mechanism, human/infrastructure consequence and selective accurate explanatory graphics."
  texture: "Believable mass, material detail and coherent light; palette follows the subject, not a mandatory teal-orange grade."
typography:
  headings: {font: "Arial", weight: 700}
  body: {font: "Arial", weight: 400}
motion:
  transitions: ["motivated hard cut", "match on action", "legible time or scale transition"]
  animation_style: "Purposeful physical or illustrative camera movement, changing material processes, readable diagrams and complete consequential actions. No slideshow substitution or decorative camera loops."
  pacing_rules: {}
audio:
  voice_style: "One original consistent offscreen narrator; clear concrete explanation, varied intention-led pace, restrained human stakes and reflective ending."
  music_mood: "Very quiet instrumental tension, curiosity and aftermath; story-turn cues, intentional silence, no swell into every breath; narration clearly dominant."
  # Linear starting gain: 0.12 -> 0.04 is about -9.54 dB for identical input.
  # Not measured stem LUFS or the pilot's exact -9 dB correction; use sound guide.
  music_volume: 0.04
  sfx_style: "Selective synchronized physical effects and contextual ambience."
asset_generation:
  image_prompt_prefix: "Original science documentary illustration, credible materials and scale, coherent geography and motivated light, landscape 16:9, "
  image_negative_prompt: "copied creator identity or branding, fabricated official evidence, gibberish scientific text, plastic materials, elastic geometry, inconsistent damage, watermark, black bars"
  consistency_anchors:
    - "Read docs/the-last-day-sound-and-narration.md for original narrator performance, much quieter score and evidence-based timing limits."
    - "Read docs/the-last-day-style-preferences.md, docs/the-last-day-style-reference-notes.md, docs/the-last-day-style-prompt-template.md and docs/the-last-day-frameo-production.md."
    - "Keep narrator, recurring geography, physical system, selected cast and consequential state stable; independent explanatory cuts need not pretend to be one continuous shot."
    - "Kie Nano Banana 2.1 first for necessary masters; clean supported references and exact outgoing selected frames for actual continuations."
quality_rules:
  - "Owner correction 4 November 2026: finish one short title-led hook in roughly 8–12 seconds (15-second maximum) and enter premise/mechanism by 15 seconds. Every actual picture beat starting within the first15seconds must last2–6seconds; later opening picture beats normally2–6seconds, never below 2 seconds; no first shot or carrier padded to 30 seconds."
  - "No accidental narration replay inside a returned take or across joined takes. Assign each utterance once, direct voice references as vocal character only, and do not infer exact speech from full-source retention or quiet endpoints."
  - "Use one bounded cached local actual-opening transcript/cut check (first 60–90 seconds) via lib.last_day_opening and docs/the-last-day-editorial-playbook.md; resolve substantial phrase repeats, overlong hook/first shot, and missing evidence before delivery. No routine whole-film/per-clip ASR, paid review or new approval gate."
  - "New compose completion requires last_day_opening_check_input in checkpoint or render-report metadata; pure opening check must pass and its source/transcript hashes must match the actual final MP4. Existing older-export publishing is not retroactively blocked."
  - "Read docs/the-last-day-editorial-playbook.md: variable explanation beats, critical phrase/picture/cause agreement, persistent recurring systems, visible mechanisms and earned callbacks. Thirty seconds is a generation envelope, not an editorial unit."
  - "Record actual selected ranges and keep reasons; assign exact local diagrams; offscreen narration may bridge honest illustrative cuts while visible speech and synchronized actions stay paired."
  - "Owner correction 3 November 2026: background score must be substantially quieter than the nuclear pilot; narrator first, restrained effects and cue changes tied to story turns. Do not confuse whole-mix LUFS with music-to-voice balance."
  - "Use cinematic stages with narrated longform science overrides, not sparse trailer narration or raw documentary silence."
  - "Follow docs/ai-video-story-engagement-preferences.md: immediate title-faithful interest, causal escalation, consequential surprises and earned payoff; facts constrain factual films and counterfactual assumptions stay explicit."
  - "Follow docs/ai-video-global-realism-preferences.md for physical behavior, meaningful continuity, environmental state and actual returned states."
  - "Follow docs/ai-video-human-performance-preferences.md and docs/ai-video-voice-selection-preferences.md: original consistent voice, varied situation-led delivery, no routine voice gate, native visible-speech pairing."
  - "Follow docs/video-fast-production-preferences.md: reuse research, quick dependency checks, one brief final check, USD 0 routine paid reviews, authorized repairs and autonomous completion."
  - "Follow docs/unlimited-plan-production-preferences.md and docs/the-last-day-frameo-production.md: Seedance 2.5 useful 30-second multishot jobs, early ready-sequence release, one verified shared account capacity, immediate refill, exact receipts, no uncertain replay and deadline-aware admission."
  - "Follow docs/portable-production-knowledge.md and docs/production-knowledge-index.json; private memory or original-device paths are not required."
  - "Follow docs/minimum-shot-duration-preferences.md: actual ordinary shots at least two seconds, including internal cuts and screen states; no flash fragments or padding."
  - "Follow docs/in-scene-text-preferences.md; purposeful diagrams/chapter graphics are allowed, physical-screen information stays on its screen, and exact technical lettering is locally controlled."
  - "Follow docs/ai-image-generation-preferences.md, docs/ai-music-preferences.md and docs/ai-style-first-pass-sop.md within actual authority; external images/TTS/music are not automatically pass-covered."
  - "Default 720p full-frame landscape; 768p only on a supported route; no portrait, filler borders or 1080p without permission."
  - "Use primary sources for consequential facts; never turn convincing generated scenes, documents or news presenters into false evidence."
  - "Complete requested duration and answer the title; technical checks and style files do not prove artistic parity or audience retention."
