  body: {font: "Arial", weight: 400}
motion:
  transitions: ["motivated hard cut", "match on action", "legible time or location transition"]
  animation_style: "Actual generated motion at natural action speed. Camera reveals information, follows a physical action or changes emotional distance. Preserve reaction time; no universal slow motion, decorative orbit, slideshow or artificial zoom."
  pacing_rules:
